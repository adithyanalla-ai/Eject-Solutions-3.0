name: Content drafts (PR for human review)

# Nothing here publishes. Each run writes `draft: true` MDX files and opens a pull request.
# A human edits, fact-checks, removes `draft: true`, and merges. Vercel then rebuilds the site.
#
# One-time repo setup:
#   Settings → Actions → General → Workflow permissions → "Read and write" and
#   tick "Allow GitHub Actions to create and approve pull requests".
# Optional (LLM-written first drafts; otherwise editor skeletons are produced):
#   Secret  ANTHROPIC_API_KEY   Variable  ANTHROPIC_MODEL

on:
  schedule:
    - cron: "30 3 * * 1,3,5"   # News: Mon/Wed/Fri 09:00 IST
    - cron: "0 4 * * 2"        # Blog: Tuesday 09:30 IST
  workflow_dispatch:
    inputs:
      kind:
        description: "What to draft"
        type: choice
        options: [news, blog]
        default: news

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-drafts
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Decide kind
        id: kind
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 4 * * 2" ]; then
            echo "kind=blog" >> "$GITHUB_OUTPUT"
          else
            echo "kind=news" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/generate-drafts.mjs ${{ steps.kind.outputs.kind }}

      - name: Validate the site still builds (drafts are excluded)
        run: npm run build

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: content/drafts-${{ steps.kind.outputs.kind }}-${{ github.run_id }}
          delete-branch: true
          commit-message: "content: ${{ steps.kind.outputs.kind }} drafts for review"
          title: "Content drafts (${{ steps.kind.outputs.kind }}): review before publishing"
          labels: content, needs-human-review
          add-paths: |
            content/news/**
            content/blog/**
            content/calendar.json
          body: |
            Automated **draft** content. Nothing is published until `draft: true` is removed.

            ### Reviewer checklist (every file)
            - [ ] Facts verified against the cited source; no unsupported claims or statistics
            - [ ] Wording is original; the source is summarised, never copied
            - [ ] Commentary adds real insight for Indian businesses
            - [ ] Title < 60 chars, description < 155 chars, correct category/services/tags
            - [ ] Any `[[EDITOR]]` or `[[VERIFY]]` marker resolved
            - [ ] Blog only: add `reviewed: YYYY-MM-DD` and keep 1,200-2,000 words
            - [ ] Remove `draft: true` to publish, or delete the file to discard

            Merging publishes the files whose `draft: true` flag was removed; the rest stay hidden.
