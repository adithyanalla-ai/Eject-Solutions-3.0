name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:content
      - run: npm run build
      - name: SEO invariants on every sitemap URL
        run: |
          npx next start -p 3000 &
          sleep 6
          node scripts/audit-seo.mjs http://localhost:3000
